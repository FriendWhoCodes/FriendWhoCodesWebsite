name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege for the job token; the deploy only needs the SSH secrets.
permissions:
  contents: read

# Never cancel a running deploy (a half-finished build would leave the site broken).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # The key only lets user 'ci' run the server's /usr/local/sbin/ci-deploy dispatcher,
          # which reads the token below and runs the fixed deploy steps for that app.
          script: echo ci-deploy:friendwhocodes
